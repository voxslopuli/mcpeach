# https://taskfile.dev
version: '3'

vars:
  BINARY: mcpeach
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list

  build:
    desc: Build the mcpeach binary into bin/
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o bin/{{.BINARY}} ./cmd/mcpeach

  test:
    desc: Run all unit tests with race detector and coverage (excludes e2e)
    cmds:
      - go test $(go list ./... | grep -v /e2e/) -race -coverprofile=coverage.txt -covermode=atomic

  e2e:
    desc: Run the E2E suite (requires tui-test)
    cmds:
      - go test ./e2e/...

  coverage:
    desc: Generate coverage report
    cmds:
      - go tool cover -func=coverage.txt

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run go vet + golangci-lint
    cmds:
      - go vet ./...
      - command -v golangci-lint >/dev/null 2>&1 || { echo "golangci-lint is required (brew install golangci-lint)"; exit 1; }
      - golangci-lint run --enable errcheck

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -l -w .

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin

  install:
    desc: Install the binary via go install
    cmds:
      - go install -ldflags "-X main.version={{.VERSION}}" ./cmd/mcpeach

  ci:
    desc: Run all CI gates (vet, test, build)
    cmds:
      - task: vet
      - task: test
      - task: build
